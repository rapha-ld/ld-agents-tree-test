# pnpm 10+ refuses to run dependency build scripts unless they are allowlisted.
# esbuild needs its postinstall to place its platform binary, and both Vite and
# Vitest need esbuild, so a fresh install fails without this. pnpm 11 spells the
# allowlist `allowBuilds`; earlier versions used `onlyBuiltDependencies`.
allowBuilds:
  esbuild: true
