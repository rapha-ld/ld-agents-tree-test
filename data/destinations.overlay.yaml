# Curated non-route destinations.
#
# These are places a user would describe as "somewhere I go" that do not change
# the URL. Every entry below was found in gonfalon source, not invented; the
# `source` field names the file so any inclusion can be checked or argued with.
#
# Deliberately excluded: confirmation dialogs, form validation states, and
# multi-step form panes. Roughly 835 files in gonfalon contain a dialog, drawer,
# or popover component and almost none of them are destinations in a sense a
# participant would recognize.
#
# `reachableFrom` is documentation for scheme authors, not an input to scoring.
# Scoring uses only where a scheme places the destination.

